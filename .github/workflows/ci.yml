name: Qualidade Finance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate typed routes for CI
        run: npx expo customize tsconfig.json

      - name: Check repository conventions
        run: npm run quality

      - name: TypeScript
        run: npm run typecheck

      - name: JavaScript regressions
        run: npm test

      - name: SQLite regressions
        run: npm run test:db

      - name: Expo dependencies
        run: npm run doctor
